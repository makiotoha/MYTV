name: IPTV Daily Update
on:
  schedule:
    - cron: '0 */4 * * *'  
  workflow_dispatch: 
env:
  TZ: Asia/Shanghai
jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install aiohttp
    - name: Run scraping script
      run: python .github/workflows/iptv.py
    - name: GetTime
      run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV
    - name: Commit changes
      env:
        REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git remote set-url origin $REPO_URL
        git add best_sorted.m3u best_sorted.m3u8
        git commit -m "自动更新直播源：${{ env.GET_TIME }}"
        git push origin main
